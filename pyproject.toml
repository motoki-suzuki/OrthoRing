
[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orthoring"
version = "0.1.0"
description = "A Python package for black-hole ringdown analysis with orthonormal modes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]

authors = [
    {name = "Motoki Suzuki"},
]

keywords = [
    "gravitational waves",
    "black hole ringdown",
    "quasinormal modes",
    "Bayesian inference",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy",
    "scipy",
    "bilby",
    "lalsuite",
    "tqdm",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orthoring = ["KerrQNMEFs-2/l*/*.dat"]